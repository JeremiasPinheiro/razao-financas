<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Crédito Rural</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f0;
            color: #2c3e50;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        h2, h3 {
            color: #1b4332;
        }

        .card {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 24px;
            border: 1px solid #d8f3dc;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        input, select {
            padding: 10px;
            border: 1px solid #b7e4c7;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #40916c;
        }

        .table-container {
            overflow-x: auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #d8f3dc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 0.95rem;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #e9ecef;
        }

        th {
            background-color: #2d6a4f;
            color: #ffffff;
            font-weight: 600;
        }

        th:nth-child(1), td:nth-child(1) {
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #e8f5e9;
        }

        .empty-msg {
            text-align: center;
            padding: 20px;
            color: #6c757d;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Simulador de Crédito Rural</h2>
        <div class="form-grid">
            <div class="form-group">
                <label for="valorEmprestimo">Valor do Empréstimo (R$)</label>
                <input type="number" id="valorEmprestimo" value="100000" step="1000" min="100">
            </div>

            <div class="form-group">
                <label for="taxaJuros">Taxa de Juros Ao Ano (%)</label>
                <input type="number" id="taxaJuros" value="10" step="0.1" min="0">
            </div>

            <div class="form-group">
                <label for="prazoMeses">Prazo Total (Meses)</label>
                <input type="number" id="prazoMeses" value="36" min="1">
            </div>

            <div class="form-group">
                <label for="carenciaMeses">Carência (Meses)</label>
                <input type="number" id="carenciaMeses" value="6" min="0">
            </div>

            <div class="form-group">
                <label for="sistemaAmortizacao">Sistema de Amortização</label>
                <select id="sistemaAmortizacao">
                    <option value="SAC">SAC (Amortização Constante)</option>
                    <option value="PRICE">PRICE (Prestação Constante)</option>
                </select>
            </div>
        </div>
    </div>

    <h3>Evolução das Parcelas do Crédito Rural</h3>
    <div class="table-container">
        <table id="tabelaEvolucao">
            <thead>
                <tr>
                    <th>Mês</th>
                    <th>Prestação</th>
                    <th>Juros</th>
                    <th>Amortização</th>
                    <th>Saldo Devedor</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <!-- Preenchido via JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        // Função para formatar valores numéricos para Real (R$)
        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function calcularSimulacao() {
            // Leitura e parse dos dados dos inputs
            const valorEmprestimo = parseFloat(document.getElementById('valorEmprestimo').value) || 0;
            const taxaAnual = parseFloat(document.getElementById('taxaJuros').value) || 0;
            const prazo = parseInt(document.getElementById('prazoMeses').value) || 0;
            const carencia = parseInt(document.getElementById('carenciaMeses').value) || 0;
            const sistema = document.getElementById('sistemaAmortizacao').value;

            const corpoTabela = document.getElementById('corpoTabela');
            corpoTabela.innerHTML = '';

            // Validações básicas para evitar tabelas incorretas ou infinitas
            if (valorEmprestimo <= 0 || prazo <= 0 || carencia >= prazo) {
                corpoTabela.innerHTML = `<tr><td colspan="5" class="empty-msg">Insira valores válidos (Prazo deve ser maior que a Carência).</td></tr>`;
                return;
            }

            // Conversão de taxa anual para taxa mensal simples/efetiva
            const taxaMensal = (taxaAnual / 100) / 12;
            const prazoAmortizacao = prazo - carencia;

            let saldoDevedor = valorEmprestimo;

            // 1. Fase de Carência (juros são acumulados ou pagos no período)
            for (let mes = 1; mes <= carencia; mes++) {
                const jurosMes = saldoDevedor * taxaMensal;
                // Na carência padrão, o juro é incorporado ao saldo devedor (capitalização)
                saldoDevedor += jurosMes;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${mes}° (Carência)</td>
                    <td>${formatarMoeda(0)}</td>
                    <td>${formatarMoeda(jurosMes)}</td>
                    <td>${formatarMoeda(0)}</td>
                    <td>${formatarMoeda(saldoDevedor)}</td>
                `;
                corpoTabela.appendChild(tr);
            }

            // Saldo base para início dos pagamentos pós-carência
            const saldoAposCarencia = saldoDevedor;

            // Cálculo das parcelas após carência (SAC ou PRICE)
            if (sistema === 'SAC') {
                const amortizacaoConstante = saldoAposCarencia / prazoAmortizacao;

                for (let i = 1; i <= prazoAmortizacao; i++) {
                    const mesAtual = carencia + i;
                    const jurosMes = saldoDevedor * taxaMensal;
                    const prestacao = amortizacaoConstante + jurosMes;
                    
                    saldoDevedor -= amortizacaoConstante;
                    if (saldoDevedor < 0.01) saldoDevedor = 0; // Correção de arredondamento

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${mesAtual}°</td>
                        <td>${formatarMoeda(prestacao)}</td>
                        <td>${formatarMoeda(jurosMes)}</td>
                        <td>${formatarMoeda(amortizacaoConstante)}</td>
                        <td>${formatarMoeda(saldoDevedor)}</td>
                    `;
                    corpoTabela.appendChild(tr);
                }
            } else if (sistema === 'PRICE') {
                // Fórmula do PMT para Tabela Price: PMT = PV * [i * (1+i)^n] / [(1+i)^n - 1]
                let prestacaoConstante = 0;
                if (taxaMensal > 0) {
                    prestacaoConstante = saldoAposCarencia * (taxaMensal * Math.pow(1 + taxaMensal, prazoAmortizacao)) / (Math.pow(1 + taxaMensal, prazoAmortizacao) - 1);
                } else {
                    prestacaoConstante = saldoAposCarencia / prazoAmortizacao;
                }

                for (let i = 1; i <= prazoAmortizacao; i++) {
                    const mesAtual = carencia + i;
                    const jurosMes = saldoDevedor * taxaMensal;
                    const amortizacao = prestacaoConstante - jurosMes;

                    saldoDevedor -= amortizacao;
                    if (saldoDevedor < 0.01) saldoDevedor = 0; // Correção de arredondamento

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${mesAtual}°</td>
                        <td>${formatarMoeda(prestacaoConstante)}</td>
                        <td>${formatarMoeda(jurosMes)}</td>
                        <td>${formatarMoeda(amortizacao)}</td>
                        <td>${formatarMoeda(saldoDevedor)}</td>
                    `;
                    corpoTabela.appendChild(tr);
                }
            }
        }

        // Vincular ouvintes de eventos (Event Listeners) para recálculo em tempo real
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('input', calcularSimulacao);
            input.addEventListener('change', calcularSimulacao);
        });

        // Executar no carregamento inicial da página
        document.addEventListener('DOMContentLoaded', calcularSimulacao);
    </script>
</body>
</html>
